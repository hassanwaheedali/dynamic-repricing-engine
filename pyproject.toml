[project]
name = "dynamic-repricing-engine"
version = "0.1.0"
description = "Universal Dynamic Repricing Engine for Pakistani e-commerce platforms (AlfaMall & DigiMall)"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "asyncio: mark test as an asyncio coroutine",
]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["scripts", "scratch"]

[[tool.mypy.overrides]]
module = ["curl_cffi.*", "pandas.*", "openpyxl.*"]
ignore_missing_imports = true



[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", "repomix-output.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]
